[tools]
node = "20.12"

[tasks.install]
description = "Install dependencies"
run = "npm install"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.dev]
description = "Start development server"
depends = ["install"]
run = "npm run dev"

[tasks.build]
description = "Production build (includes sitemap generation)"
depends = ["install"]
run = "npm run build"

[tasks.preview]
description = "Preview production build locally"
run = "npm run preview"

[tasks.lint]
description = "Run ESLint with auto-fix"
depends = ["install"]
run = "npm run lint"

[tasks.check-collisions]
description = "Check for event timing collisions in meta_events.js"
run = "npm run check-collisions"
