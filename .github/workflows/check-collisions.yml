name: Check event collisions

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-collisions:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up tools (mise)
        uses: jdx/mise-action@v5

      - name: Install dependencies
        run: npm ci

      - name: Check for event collisions
        run: mise run check-collisions
